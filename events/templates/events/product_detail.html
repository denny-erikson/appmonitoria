{% extends "base.html" %}

{% block title %}Produto{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
    <div>
        <p class="text-xs uppercase tracking-wide text-gray-500">Produto</p>
        <h1 class="text-2xl font-semibold text-gray-900">{{ product.name }}</h1>
        <p class="text-sm text-gray-500">Associado a eventos selecionados.</p>
    </div>
    <div class="flex items-center gap-2">
        <a href="{% url 'events:product_edit' product.pk %}" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M4 13.5V20h6.5l7.732-7.732a1.5 1.5 0 000-2.122l-4.878-4.878a1.5 1.5 0 00-2.122 0L4 13.5z"/></svg>
            Editar
        </a>
        <a href="{% url 'events:product_list' %}" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 text-sm font-medium">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            Voltar
        </a>
    </div>
</div>

<div class="bg-white shadow-sm rounded-xl border border-gray-100 p-5">
    <h2 class="text-lg font-semibold text-gray-900 mb-3">Eventos</h2>
    <div class="flex flex-wrap gap-2 text-sm text-gray-700">
        {% for ev in product.events.all %}
            <span class="inline-flex items-center px-3 py-1 rounded-full bg-gray-100 text-gray-700">{{ ev.name }}</span>
        {% empty %}
            <span class="text-gray-500 text-sm">Sem eventos associados.</span>
        {% endfor %}
    </div>
</div>
{% endblock %}
