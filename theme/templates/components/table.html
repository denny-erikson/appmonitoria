<table class="min-w-full bg-white border rounded-xl overflow-hidden">
    <thead class="bg-gray-100 text-left">
        <tr>
            {% for header in headers %}
                <th class="px-4 py-2 font-semibold text-sm text-gray-700">{{ header }}</th>
            {% endfor %}
        </tr>
    </thead>

    <tbody>
        {% block rows %}
        {% endblock %}
    </tbody>
</table>
