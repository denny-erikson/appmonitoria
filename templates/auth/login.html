{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-slate-50 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white border border-gray-100 rounded-2xl shadow-xl p-8">
        <div class="mb-6 text-center space-y-1">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-indigo-100 text-indigo-700 font-semibold text-lg">M</div>
            <h1 class="text-2xl font-semibold text-gray-900">Monitoria</h1>
            <p class="text-sm text-gray-500">Acesse sua conta para continuar.</p>
        </div>
        <form method="post" class="space-y-5">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="text-sm text-red-600">{{ form.non_field_errors }}</div>
            {% endif %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="id_username">Usuário</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    value="{{ form.username.value|default_if_none:'' }}"
                    autocomplete="username"
                    class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                />
                {% for error in form.username.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="id_password">Senha</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                />
                {% for error in form.password.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
            </div>
            <button class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 shadow">
                Entrar
            </button>
        </form>
    </div>
</body>
</html>
